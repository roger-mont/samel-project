services:
  edge-maca-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edge_maca_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MACA_ID=MACA-UTI-001
      - CENTRAL_API_URL=http://192.168.1.100:8000
      - EDGE_API_TOKEN=samel_secret_token_123
      - SQLITE_DB_PATH=/app/data/edge_maca.db
      - SYNC_BATCH_SIZE=50
      - SYNC_INTERVAL_SEC=60
      - MAX_RETENTION_RECORDS=50000
      - RETENTION_DAYS=7
      - LOG_LEVEL=INFO
    volumes:
      # Volume persistente externo para proteger o SQLite contra atualizações de container
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
